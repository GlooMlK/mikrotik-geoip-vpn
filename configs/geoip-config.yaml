# Mihomo GeoIP VPN конфигурация
# Замените my-srv.yaml на свою VLESS-ссылку!
external-controller: 0.0.0.0:9090
external-ui: ui
secret: ЗАМЕНИТЕ_СЕКРЕТ
unified-delay: true
log-level: info
ipv6: false

# DNS — mihomo сам отвечает на DNS-запросы
# Решает проблему UDP DNS timeout через TUN
dns:
  enable: true
  listen: 0.0.0.0:53
  nameserver:
    - 77.88.8.8        # Яндекс (RU, быстрый)
    - 1.1.1.1          # Cloudflare (резерв)

# Провайдер VLESS-сервера
proxy-providers:
  SRV:
    type: file
    path: /etc/mihomo/my-srv.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
      timeout: 5000

proxy-groups:
  - name: SELECTOR
    type: select
    use:
      - SRV

# Автообновляемые гео-базы (каждые 6 часов)
# Файлы в rules/ подхватятся автоматически если уже существуют
rule-providers:
  ru-blocked:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/runetfreedom/russia-blocked-geoip/release/mrs/ru-blocked.mrs"
    interval: 21600
    path: ./rules/ru-blocked.mrs

  ru-blocked-community:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/runetfreedom/russia-blocked-geoip/release/mrs/ru-blocked-community.mrs"
    interval: 21600
    path: ./rules/ru-blocked-community.mrs

listeners:
  - name: mixed-in
    type: mixed
    port: 1080
  - name: tun-in
    type: tun
    stack: mixed  # ВАЖНО: не mips!
    auto-detect-interface: true
    auto-route: true
    auto-redirect: true
    inet4-address:
    - 198.19.0.1/30

rules:
  # Блокируем QUIC (UDP 443) — DPI не может различить зашифрованный QUIC
  # Браузер fallback на TCP → TLS → GeoIP работает корректно
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT

  # ═══════════════════════════════════════════════════
  # Госсайты РФ — ВСЕГДА DIRECT (до блок-листов!)
  # Защита от ложных срабатываний antifilter на гос-IP
  # ═══════════════════════════════════════════════════
  - DOMAIN-SUFFIX,nalog.ru,DIRECT
  - DOMAIN-SUFFIX,gosuslugi.ru,DIRECT
  - DOMAIN-SUFFIX,gov.ru,DIRECT
  - DOMAIN-SUFFIX,pfr.ru,DIRECT
  - DOMAIN-SUFFIX,sfr.gov.ru,DIRECT
  - DOMAIN-SUFFIX,fns.ru,DIRECT
  - DOMAIN-SUFFIX,mos.ru,DIRECT
  - DOMAIN-SUFFIX,mosreg.ru,DIRECT
  - DOMAIN-SUFFIX,customsonline.ru,DIRECT
  - DOMAIN-SUFFIX,rospotrebnadzor.ru,DIRECT
  - DOMAIN-SUFFIX,garant.ru,DIRECT
  - DOMAIN-SUFFIX,consultant.ru,DIRECT
  - DOMAIN-SUFFIX,skbkontur.ru,DIRECT
  - DOMAIN-SUFFIX,1tb.ru,DIRECT
  - DOMAIN-SUFFIX,tinkoff.ru,DIRECT
  - DOMAIN-SUFFIX,sberbank.ru,DIRECT
  - DOMAIN-SUFFIX,vtb.ru,DIRECT
  - DOMAIN-SUFFIX,gazprombank.ru,DIRECT
  - DOMAIN-SUFFIX,alfabank.ru,DIRECT
  - DOMAIN-SUFFIX,vtb24.ru,DIRECT
  - DOMAIN-SUFFIX,rshb.ru,DIRECT
  - DOMAIN-SUFFIX,omkbb.ru,DIRECT
  - DOMAIN-SUFFIX,gibdd.ru,DIRECT
  - DOMAIN-SUFFIX,mvd.gov.ru,DIRECT
  - DOMAIN-SUFFIX,minfin.gov.ru,DIRECT
  - DOMAIN-SUFFIX,economy.gov.ru,DIRECT
  - DOMAIN-SUFFIX,rosreestr.ru,DIRECT
  - DOMAIN-SUFFIX,zakupki.gov.ru,DIRECT
  - DOMAIN-SUFFIX,budget.gov.ru,DIRECT
  - DOMAIN-SUFFIX,uslugio.ru,DIRECT
  - DOMAIN-SUFFIX,kadarshi.ru,DIRECT
  - DOMAIN-SUFFIX,energovopros.ru,DIRECT
  - DOMAIN-SUFFIX,rbc.ru,DIRECT
  - DOMAIN-SUFFIX,avito.ru,DIRECT
  - DOMAIN-SUFFIX,ozon.ru,DIRECT
  - DOMAIN-SUFFIX,wildberries.ru,DIRECT
  - DOMAIN-SUFFIX,yandex.ru,DIRECT
  - DOMAIN-SUFFIX,yandex.net,DIRECT
  - DOMAIN-SUFFIX,ya.ru,DIRECT

  # ═══════════════════════════════════════════════════
  # Иностранные IP — через VPN
  # ═══════════════════════════════════════════════════
  - RULE-SET,ru-blocked,SELECTOR
  - RULE-SET,ru-blocked-community,SELECTOR

  # Локальная сеть — мимо VPN
  - GEOIP,private,DIRECT,no-resolve

  # Российские домены и IP — напрямую
  - GEOSITE,category-ru,DIRECT
  - GEOIP,RU,DIRECT

  # ВСЁ ОСТАЛЬНОЕ — через VPN
  - MATCH,SELECTOR
